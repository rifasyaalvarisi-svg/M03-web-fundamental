<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="bg-white shadow-lg rounded-2xl w-full max-w-lg p-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">Form Register</h1>

    <form id="registerForm" action="dashboard.html" method="GET" class="space-y-4" novalidate>

      <!-- Username -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="username" name="username"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="err-username" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Password -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" name="password"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="err-password" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Nama -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nama</label>
        <input type="text" id="nama" name="nama"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="err-nama" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Tanggal Lahir -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="err-tanggalLahir" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Alamat -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Alamat</label>
        <textarea id="alamat" name="alamat" rows="2"
                  class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        <p id="err-alamat" class="text-red-500 text-sm mt-1"></p>
      </div>

      <!-- Nomor Telepon -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nomor Telepon</label>
        <input type="text" id="noTelp" name="noTelp" placeholder="62xxxxxxxxxx"
               class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <p id="err-noTelp" class="text-red-500 text-sm mt-1"></p>
      </div>

      <button type="submit"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg transition">
        Daftar
      </button>
    </form>
  </div>

  <script src="validasi_input.js"></script>
</body>
</html>
